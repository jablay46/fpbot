[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfpbot"
version = "0.1.0"
description = "Automated trading bot for the MyFundedPerps developer API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "websockets>=12.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mfpbot = "mfpbot.cli:main"

[tool.setuptools.packages.find]
include = ["mfpbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
